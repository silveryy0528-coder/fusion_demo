# Configuration for scripts/run_fusion.py
#
# data_dir must contain a manifest.json + one <modality>.npz per modality
# (see data/README.md for the data contract).

data_dir: ../data/synthetic

# Modality to predict.
target_modality: Ag

# Modalities used as predictors (all of their reconstructions contribute
# feature columns -- see fusion_demo.fusion.build_cross_modality_model).
predictor_modalities: [haadf, Au]

# Feature filters applied to every predictor reconstruction
# (see fusion_demo.features for available names).
filters: [gaussf, rangefilt, stdfilt, gradmag, gausslap, maxf, minf]

# Optional; defaults shown are fusion_demo's own defaults.
gauss_base: 1.41421356237 # sqrt(2)
gauss_depth: 1
n_components: null

# Base folder for run outputs; each run is saved to results_dir/<timestamp>/.
results_dir: ../results
