# A CI pipeline to test the code on:
# 1. Windows with Python 3.10, 3.11, and 3.12
# 2. Each commit to a pull request to the main branch
# 3. Each push to the repository

name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [windows-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install src
      run: python -m pip install -e ".[dev]"

    - name: Test with pytest
      run: pytest tests

    - name: Format with black
      run: black --check src/fusion_demo
