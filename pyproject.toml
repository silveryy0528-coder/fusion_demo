[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion_demo"
version = "0.1.0"
description = "Cross-modal HAADF-STEM and EDS image fusion demo using PLS regression"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yan Guo" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]