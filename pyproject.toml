[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion_demo"
version = "0.1.0"
description = "Cross-modality (HAADF-STEM / EDS) image fusion demo via PLS regression"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yan Guo" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black"
]

[tool.setuptools.packages.find]
where = ["src"]
